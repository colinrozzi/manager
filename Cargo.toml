[package]
name = "manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "theater-studio"
path = "src/studio/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen-rt = { version = "0.39.0", features = ["bitflags"] }
rustyline = "10.0.0"
clap = { version = "4.2", features = ["derive"] }
colored = "2.0"
indicatif = "0.17"
thiserror = "1.0"
uuid = { version = "1.3", features = ["v4"] }
ctrlc = "3.2"
regex = "1.9.0"
